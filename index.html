<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Rock+Salt&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main class="card">
      <img
        class="main-image"
        src="assets/images/illustration-article.svg"
        alt="Yellow and Black Abstract Image"
      />
      <section class="main-content">
        <div class="learning-button">
          <button>Learning</button>
        </div>
        <section class="publish">Published 21 Dec 2023</section>
        <header>HTML & CSS foundations</header>

        <p>
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <address class="author-image-name">
          <img
            src="assets/images/image-avatar.webp"
            alt="Small Rounded Picture of Greg Hooper"
            width="30px"
            height="30px"
          />
          <address class="author-name">Greg Hooper</address>
        </address>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/arielvonlestat">AVL</a>.
    </footer>
  </body>
</html>
